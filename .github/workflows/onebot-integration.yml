name: OneBot integration regression

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onebot-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Build validation images
        run: |
          docker build -t dsh-qqbot:onebot-${{ matrix.arch }} .
          docker build -t qqbot-gensokyo:integration third_party/gensokyo-mcp
          docker build -t qqbot-sealdice:integration third_party/sealdice-core
      - name: Verify disabled tools and existing chat behavior
        run: IMAGE=dsh-qqbot:onebot-${{ matrix.arch }} SKIP_BUILD=1 ./scripts/test-local.sh
      - name: Verify real MCP and native SeaDice behavior
        run: python3 scripts/test-onebot-integration.py --qqbot-image dsh-qqbot:onebot-${{ matrix.arch }} --evidence /tmp/onebot-integration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onebot-native-${{ matrix.arch }}
          path: /tmp/onebot-integration.json
          if-no-files-found: ignore
