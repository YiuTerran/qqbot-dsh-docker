name: Publish Docker Hub image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: dockerhub-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    environment:
      name: de
    env:
      IMAGE: tryao/qqbot-dsh
      TAG: ${{ github.ref_name }}
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_SECRET: ${{ secrets.DOCKERHUB_SECRET }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_SECRET }}

      - name: Build local validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          push: false
          platforms: ${{ matrix.platform }}
          tags: dsh-qqbot:test-local-${{ matrix.arch }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Run chat-only security regression
        run: IMAGE=dsh-qqbot:test-local-${{ matrix.arch }} SKIP_BUILD=1 ./scripts/test-local.sh

      - name: Build native OneBot backend validation images
        run: |
          docker build -t qqbot-gensokyo:integration third_party/gensokyo-mcp
          docker build -t qqbot-sealdice:integration third_party/sealdice-core

      - name: Run real MCP to SeaDice container regression
        run: python3 scripts/test-onebot-integration.py --qqbot-image dsh-qqbot:test-local-${{ matrix.arch }} --evidence /tmp/onebot-integration.json

      - name: Preserve OneBot integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onebot-integration-${{ matrix.arch }}
          path: /tmp/onebot-integration.json
          if-no-files-found: ignore

      - name: Build and push architecture image by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Save image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish multi-architecture manifest
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: de
    env:
      IMAGE: tryao/qqbot-dsh
      TAG: ${{ github.ref_name }}
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_SECRET: ${{ secrets.DOCKERHUB_SECRET }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_SECRET }}

      - name: Download architecture digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - name: Validate and create multi-architecture manifest
        shell: bash
        run: |
          mapfile -t DIGESTS < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${#DIGESTS[@]}" -eq 2 ]]
          for digest in "${DIGESTS[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          done

          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            "$IMAGE@sha256:${DIGESTS[0]}" \
            "$IMAGE@sha256:${DIGESTS[1]}"

          docker buildx imagetools inspect --raw "$IMAGE:$TAG" > /tmp/manifest.json
          jq -e '
            [.manifests[] | select(.platform.architecture != "unknown") | "\(.platform.os)/\(.platform.architecture)"]
            | sort == ["linux/amd64", "linux/arm64"]
          ' /tmp/manifest.json
